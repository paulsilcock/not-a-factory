name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm --filter acceptance-tests exec playwright install --with-deps chromium
      # Starts the app and Postgres with Docker Compose (see acceptance-tests/global-setup.ts)
      - run: pnpm test:acceptance
      - run: pnpm build
